# go2rtc on an always-on Mac: shrinks cameras the frame can't decode to 720p and serves them as RTSP
# for Home Assistant's Generic Cameras (camera.<name>_stream). See docs/house.md → "Transcoding on a
# Mac". Copy to ~/go2rtc/go2rtc.yaml and fill in the passwords and stream ids.
#
# Streams run only while something is watching: go2rtc starts ffmpeg when a client connects, and
# ring-mqtt starts the Ring stream when go2rtc connects to it.
api:
  listen: "127.0.0.1:1984"   # the web UI, local to the Mac only
rtsp:
  listen: ":8554"
  username: frame
  password: "<a password of your own; Home Assistant uses it in the camera's stream URL>"
webrtc:
  listen: ""                 # not used: Home Assistant's own go2rtc does WebRTC to the frame
streams:
  # ring-mqtt's RTSP: the add-on's port 8554 exposed on the home network, its livestream user and
  # password set in the add-on's options, and each camera's id from its ring-mqtt "Info" sensor
  # (stream_Source: rtsp://…-ring-mqtt:8554/<id>_live).
  garage: "ffmpeg:rtsp://frame:<ring-mqtt livestream password>@<home assistant ip>:8554/<id>_live#video=h264/vt#width=1280"
  driveway: "ffmpeg:rtsp://frame:<ring-mqtt livestream password>@<home assistant ip>:8554/<id>_live#video=h264/vt#width=1280"
ffmpeg:
  bin: /Users/<you>/go2rtc/ffmpeg
  # Software decode (a laptop i7 barely notices 15 fps), hardware encode on VideoToolbox: 2.5 Mbit/s,
  # a keyframe every 2 s so the frame starts quickly, no B-frames (its decoder likes it simple).
  h264/vt: "-c:v h264_videotoolbox -realtime true -profile:v main -b:v 2500k -maxrate 3000k -g 30 -bf 0 -pix_fmt yuv420p"
log:
  level: info

# go2rtc for the camera relay (docs/house.md → "Cameras the frame can't decode"): shrinks Ring cameras
# too big for the frame's video decoder to 1280 wide on the Mac's video hardware, and adds their sound.
# camera-relay.sh copies this to ~/go2rtc/go2rtc.yaml the first time; fill in the <…> parts.
#
# Streams run only while something watches: go2rtc starts ffmpeg when a viewer connects, and ring-mqtt
# starts the Ring stream when ffmpeg connects to it.
api:
  # Loopback only. go2rtc's API can run commands (exec: sources), so it must never be open to the
  # network. The frame reaches its WebRTC signalling through relay-gate.py (port 1985), which lets
  # through only that, and only with the token.
  listen: "127.0.0.1:1984"
  origin: "*"                # the frame's page comes from the Worker's address
rtsp:
  listen: ":8554"            # for Home Assistant's Generic Cameras (camera.<name>_stream)
  username: frame
  password: "<a password of your own; Home Assistant uses it in the camera's stream address>"
webrtc:
  listen: ":8555"            # the frame's video and sound, straight from here
streams:
  # Per camera, named as you like (<name> matches camera.<name>_stream in Home Assistant):
  #   <name>     video only, for Home Assistant's Generic Camera.
  #   <name>_av  the same video plus the camera's sound, for the frame. The sound runs in its own
  #              ffmpeg: one ffmpeg muxing both held the video seconds behind the audio, which played
  #              choppy and then froze.
  # The video: hardware decode and scale (VideoToolbox, a few % of a core) and hardware encode;
  # 2.5 Mbit/s, a keyframe every 2 s so a viewer starts quickly, no B-frames (the frame's decoder likes
  # it simple). scale_vt needs both sides: 1280x718 for a 16:9 camera, 1280x1280 for a square doorbell.
  # exec (ffmpeg run directly), not go2rtc's ffmpeg: source: that wrapper added 5-7 s to a cold start.
  # The sound: boosted 4x with a limiter (Ring's is quiet), as Opus for WebRTC.
  # ring-mqtt's address: the add-on's port 8554 exposed on the home network, its livestream user and
  # password from the add-on's options, and the camera's id from its ring-mqtt "Info" sensor
  # (stream_Source: rtsp://…-ring-mqtt:8554/<id>_live).
  # Here: a Spotlight Cam Pro (2624x1472, which the frame can't decode). Copy the pair per camera.
  spotlight: &spotlight "exec:/Users/<you>/go2rtc/ffmpeg -hide_banner -loglevel error -fflags nobuffer -flags low_delay -analyzeduration 1000000 -probesize 500000 -rtsp_transport tcp -hwaccel videotoolbox -hwaccel_output_format videotoolbox_vld -i rtsp://frame:<ring-mqtt livestream password>@<home assistant ip>:8554/<id>_live -an -vf scale_vt=w=1280:h=718 -c:v h264_videotoolbox -realtime true -profile:v main -b:v 2500k -maxrate 3000k -g 30 -bf 0 -pix_fmt yuv420p -rtsp_transport tcp -f rtsp {output}"
  spotlight_av:
    - *spotlight
    - "exec:/Users/<you>/go2rtc/ffmpeg -hide_banner -loglevel error -fflags nobuffer -flags low_delay -analyzeduration 1000000 -probesize 500000 -rtsp_transport tcp -i rtsp://frame:<ring-mqtt livestream password>@<home assistant ip>:8554/<id>_live -vn -map 0:a:0 -af volume=4,alimiter=limit=0.9 -c:a libopus -ar 48000 -ac 1 -b:a 48k -rtsp_transport tcp -f rtsp {output}"
log:
  level: info

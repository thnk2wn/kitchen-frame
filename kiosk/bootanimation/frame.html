<!doctype html><meta charset="utf-8"><style>html,body{margin:0;width:800px;height:480px;background:#000;overflow:hidden}
.c{width:800px;height:480px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;font-family:-apple-system,Roboto,'Helvetica Neue',sans-serif;opacity:var(--o)}</style>
<div class="c" id="c"><svg width="168" height="168" viewBox="0 0 112 112" fill="none"><rect x="6" y="14" width="100" height="74" rx="14" stroke="#e5e5ea" stroke-width="5"/><path d="M30 70 L48 48 L60 60 L70 50 L84 70 Z" fill="#ff9f0a"/><circle cx="76" cy="36" r="7" fill="#ffd60a"/><path d="M40 98 H72" stroke="#e5e5ea" stroke-width="5" stroke-linecap="round"/></svg>
<div id="n" style="font-size:46px;font-weight:600;letter-spacing:-.01em;color:#e5e5ea">Kitchen Frame</div></div>
<script>
// #<opacity>&name=<frame name>
var h = new URLSearchParams(location.hash.slice(1).replace(/^([\d.]+)/, 'o=$1'));

if (h.get('name')) document.getElementById('n').textContent = h.get('name');
</script>

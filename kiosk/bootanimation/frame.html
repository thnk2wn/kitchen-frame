<!doctype html>
<meta charset="utf-8">
<!-- One frame of the boot animation, drawn for the time in the address: #part=intro|loop&t=<s>&name=<name>.
     build.sh screenshots it at 15 frames a second. intro (played once): the frame draws itself, the hills
     rise, the sun comes up, the name fades in. loop (repeated until Android has started): the sun's glow
     breathes and a warm light drifts across the picture, the same at its end as at its start. -->
<style>
  html, body { margin: 0; width: 800px; height: 480px; background: #000; overflow: hidden; }
  .c { width: 800px; height: 480px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; font-family: -apple-system, Roboto, 'Helvetica Neue', sans-serif; }
  .name { font-size: 46px; font-weight: 600; letter-spacing: -.01em; color: #e5e5ea; }
</style>
<div class="c">
  <svg width="240" height="210" viewBox="0 0 240 210" fill="none">
    <defs>
      <clipPath id="pic"><rect x="22" y="22" width="196" height="136" rx="20" /></clipPath>
      <radialGradient id="glow"><stop offset="0" stop-color="#ffd60a" stop-opacity=".55" /><stop offset="1" stop-color="#ffd60a" stop-opacity="0" /></radialGradient>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2a4a" /><stop offset="1" stop-color="#3a2a3e" /></linearGradient>
      <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0" /><stop offset=".5" stop-color="#ffe9b0" stop-opacity=".16" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></linearGradient>
    </defs>
    <g clip-path="url(#pic)">
      <rect id="sky" x="22" y="22" width="196" height="136" fill="url(#sky)" />
      <circle id="glowc" cx="160" cy="62" r="46" fill="url(#glow)" />
      <circle id="sun" cx="160" cy="62" r="13" fill="#ffd60a" />
      <path id="hills" d="M22 158 L22 132 L78 84 L112 116 L134 98 L190 140 L218 122 L218 158 Z" fill="#ff9f0a" />
      <path d="M22 158 L22 146 L70 120 L104 140 L150 118 L218 150 L218 158 Z" fill="#c45a00" id="front" />
      <rect id="sweepr" x="-60" y="22" width="90" height="136" fill="url(#sweep)" />
    </g>
    <rect id="frame" x="16" y="16" width="208" height="148" rx="24" stroke="#e5e5ea" stroke-width="8" />
    <path id="stand" d="M86 190 H154" stroke="#e5e5ea" stroke-width="8" stroke-linecap="round" />
  </svg>
  <div class="name" id="n">Kitchen Frame</div>
</div>
<script>
  const h = new URLSearchParams(location.hash.slice(1));
  const part = h.get('part') || 'loop', t = Number(h.get('t') || 0);
  const INTRO = 1.2, LOOP = 3;
  if (h.get('name')) document.getElementById('n').textContent = h.get('name');
  const $ = (id) => document.getElementById(id);
  const ease = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
  const span = (a, b) => ease((t - a) / (b - a)); // 0..1 between a and b seconds

  // The frame's outline, drawn: dash offset from its full length to 0.
  const frame = $('frame'), len = frame.getTotalLength();
  frame.style.strokeDasharray = len;
  if (part === 'intro') {
    frame.style.strokeDashoffset = len * (1 - span(0, .55));
    $('stand').style.opacity = span(.35, .6);
    $('sky').style.opacity = span(.2, .6);
    $('hills').setAttribute('transform', `translate(0 ${60 * (1 - span(.35, .8))})`);
    $('front').setAttribute('transform', `translate(0 ${60 * (1 - span(.45, .9))})`);
    const s = span(.55, 1.1);
    $('sun').setAttribute('cy', 120 - 58 * s); $('glowc').setAttribute('cy', 120 - 58 * s);
    $('sun').style.opacity = s; $('glowc').style.opacity = s * .8;
    $('n').style.opacity = span(.7, 1.2);
    $('sweepr').style.opacity = 0;
  } else {
    // Seamless: everything is a whole number of cycles over LOOP seconds.
    const p = (t % LOOP) / LOOP, w = Math.sin(2 * Math.PI * p);
    frame.style.strokeDashoffset = 0;
    $('glowc').setAttribute('r', 46 + 8 * w);
    $('glowc').style.opacity = .8 + .2 * w;
    $('sweepr').setAttribute('x', -90 + p * 330);
  }
</script>

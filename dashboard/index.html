<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Lay out at 1280 CSS px wide: the 1920×1080 FRAME156 shows that at 1.5× (1280×720), 10" frames at 1×.
       No initial-scale: Android WebView would pin the scale to 1 and lay out at the full panel width. -->
  <meta name="viewport" content="width=1280, user-scalable=no">
  <title>Frame</title>
  <script>
    // Setup links (scripts/frame-url.sh) carry the dashboard key and Home Assistant token after #, which
    // a browser never sends, so they can't land in the Worker's request logs. This moves them into the
    // address's query here, in the page, before the app starts; each part of the app then reads its
    // setting and removes it from the address, as it did when they came as ?key=…&ha_token=….
    (function () {
      if (location.hash.length < 2 || location.hash.indexOf('=') < 0) return;
      var q = new URLSearchParams(location.search);
      new URLSearchParams(location.hash.slice(1)).forEach(function (v, k) { q.set(k, v); });
      history.replaceState(null, '', location.pathname + '?' + q);
    })();
  </script>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- The start screen, on black like the kiosk before it, until the app replaces it. Inline styles:
       it shows before the stylesheet has loaded. -->
  <div id="app"><div style="position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;font-family:-apple-system,Roboto,'Segoe UI',sans-serif">
    <svg width="112" height="112" viewBox="0 0 112 112" fill="none" aria-hidden="true">
      <rect x="6" y="14" width="100" height="74" rx="14" stroke="#e5e5ea" stroke-width="5"/>
      <path d="M30 70 L48 48 L60 60 L70 50 L84 70 Z" fill="#ff9f0a"/>
      <circle cx="76" cy="36" r="7" fill="#ffd60a"/>
      <path d="M40 98 H72" stroke="#e5e5ea" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <div id="frame-name" style="font-size:30px;font-weight:600;letter-spacing:-.01em;color:#e5e5ea">Kitchen Frame</div>
    <p id="boot" style="margin:0;max-width:900px;padding:0 40px;text-align:center;font-size:19px;color:#8e8e93">Starting…</p>
  </div></div>
  <script>
    // The frame's name (FRAME_NAME in .frame.vars, sent once as ?frame_name=): saved, shown here.
    (function () {
      try {
        var q = new URLSearchParams(location.search);
        if (q.has('frame_name')) {
          var v = q.get('frame_name');
          v ? localStorage.setItem('frame-name', v) : localStorage.removeItem('frame-name');
          q.delete('frame_name');
          history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash);
        }
        var n = localStorage.getItem('frame-name');
        if (n) document.getElementById('frame-name').textContent = n;
      } catch (e) {}
    })();
    // Wall display self-healing: if the bundle failed to start, keep reloading until it does.
    // A script error is shown on screen instead, so the frame can be diagnosed without a cable.
    (function () {
      var boot = document.getElementById('boot');
      // A failed start is shown, then retried: right after a deploy the page can briefly ask for a
      // script that hasn't reached every Cloudflare location yet, and a wall display must not stay stuck.
      // url: a file that failed to load. Before retrying it's fetched again past the cache, which also
      // replaces any bad copy kept there (a 404 kept for a year once left the frame stuck: 2026-10-16).
      function fail(msg, url) {
        if (window.__booted || window.__failed) return;
        window.__failed = true;
        if (boot) boot.textContent = 'Couldn’t start: ' + msg + ' (trying again shortly)';
        setTimeout(function () {
          var again = function () { location.reload(); };
          if (url && window.fetch) fetch(url, { cache: 'reload' }).then(again, again); else again();
        }, 15000);
      }
      window.addEventListener('error', function (e) {
        var t = e.target;
        // A file that failed to load (script or stylesheet) has no message; name it.
        if (t && t !== window && (t.src || t.href)) return fail('couldn’t load ' + String(t.src || t.href).split('/').pop(), t.src || t.href);
        fail((e.message || e.type) + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) { fail(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(function () { if (!window.__booted && !window.__failed) location.reload(); }, 10000);
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

# The Kitchen Frame iPhone app. Generate the Xcode project with XcodeGen (brew install xcodegen):
#   cd ios && xcodegen && open KitchenFrame.xcodeproj
# The project file is generated, not committed: this file is the source of truth. Signing (your team
# and bundle id) lives in Config/Signing.xcconfig, which is gitignored; copy Signing.example.xcconfig.
name: KitchenFrame
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  KitchenFrame:
    type: application
    platform: iOS
    sources: [KitchenFrame]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kitchenframe
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kitchen Frame
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: KitchenFrameShare
    entitlements:
      path: KitchenFrame/KitchenFrame.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).kitchenframe.shared]
    info:
      path: KitchenFrame/Info.plist
      properties:
        # The Keychain group the pairing lives in, shared with the share extension.
        KeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).kitchenframe.shared
        # The frame's Settings → Pair a phone QR code opens kitchenframe://pair?url=…&key=…
        CFBundleURLTypes:
          - CFBundleURLName: kitchenframe
            CFBundleURLSchemes: [kitchenframe]
  # "Kitchen Frame" in the share sheet: a photo or video shows on the frame, a YouTube link plays there.
  KitchenFrameShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - KitchenFrame/API.swift
      - KitchenFrame/Pairing.swift
      - KitchenFrame/MediaSender.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kitchenframe.share
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kitchen Frame
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: Share/Share.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).kitchenframe.shared]
    info:
      path: Share/Info.plist
      properties:
        KeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).kitchenframe.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
